<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1880" viewBox="0 0 1500 1880" role="img" aria-labelledby="title desc">
  <title id="title">Disk Organiser Analysis and Execution Flow</title>
  <desc id="desc">Process flow from user request to analysis context creation, reasoning, preview, chat refinement, selective execution, backup, and undo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f6f8f3"/>
      <stop offset="100%" stop-color="#edf4fb"/>
    </linearGradient>
    <linearGradient id="step" x1="0" x2="1">
      <stop offset="0%" stop-color="#204c5a"/>
      <stop offset="100%" stop-color="#2e6f7f"/>
    </linearGradient>
    <linearGradient id="decision" x1="0" x2="1">
      <stop offset="0%" stop-color="#ab5a0a"/>
      <stop offset="100%" stop-color="#cb7c11"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102a43" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect width="1500" height="1880" fill="url(#bg)" rx="24"/>
  <text x="62" y="74" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#172026">Disk Organiser Runtime Flow</text>
  

  <rect x="450" y="150" width="600" height="98" rx="20" fill="url(#step)" filter="url(#shadow)"/>
  <text x="490" y="206" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">1. User starts analysis from the UI</text>

  <rect x="450" y="314" width="600" height="120" rx="20" fill="#ffffff" stroke="#b7d2cf" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="364" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#16323a">2. POST /api/analyse/start</text>
  <text x="490" y="396" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#425466">Creates background analysis job and progress stream</text>

  <rect x="450" y="498" width="600" height="120" rx="20" fill="#ffffff" stroke="#b7d2cf" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="548" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#16323a">3. context_builder prepares contexts</text>
  <text x="490" y="580" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#425466">Adds stale signals, near-duplicate indicators, and capabilities</text>

  <polygon points="750,700 980,830 750,960 520,830" fill="url(#decision)" filter="url(#shadow)"/>
  <text x="620" y="804" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#fff8ef">4. Is analysis ready?</text>
  <text x="642" y="838" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#fff8ef">Wait for job finish or use supplied contexts</text>

  <rect x="450" y="1028" width="600" height="128" rx="20" fill="#ffffff" stroke="#b7d2cf" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="1078" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#16323a">5. POST /api/analyse/reason</text>
  <text x="490" y="1110" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#425466">Modelito planning, fallback heuristics, action validation</text>

  <rect x="450" y="1218" width="600" height="128" rx="20" fill="#ffffff" stroke="#b7d2cf" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="1268" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#16323a">6. Preview operation is stored</text>
  <text x="490" y="1300" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#425466">Grouped preview returned with summary and rejected-action metadata</text>

  <polygon points="750,1458 980,1588 750,1718 520,1588" fill="url(#decision)" filter="url(#shadow)"/>
  <text x="626" y="1560" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#fff8ef">7. Refine plan or execute?</text>
  <text x="628" y="1594" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#fff8ef">Loop with chat feedback before final mutation</text>

  <rect x="90" y="1270" width="300" height="136" rx="20" fill="#fffaf2" stroke="#efc98d" stroke-width="2" filter="url(#shadow)"/>
  <text x="124" y="1322" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#5f370e">POST /api/chat</text>
  <text x="124" y="1354" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b4b25">Refines suggestions</text>
  <text x="124" y="1378" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b4b25">Appends chat history</text>

  <rect x="1110" y="1270" width="300" height="136" rx="20" fill="#fffaf2" stroke="#efc98d" stroke-width="2" filter="url(#shadow)"/>
  <text x="1144" y="1314" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#5f370e">POST /api/organise</text>
  <text x="1144" y="1340" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#5f370e">/execute</text>
  <text x="1144" y="1368" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b4b25">Selective action indexes</text>
  <text x="1144" y="1390" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b4b25">Optional local snapshot</text>

  <rect x="1110" y="1582" width="330" height="150" rx="20" fill="#ffffff" stroke="#b7d2cf" stroke-width="2" filter="url(#shadow)"/>
  <text x="1144" y="1640" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#16323a">Backup before mutate</text>
  <text x="1144" y="1672" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#425466">fs_ops + op_store</text>
  <text x="1144" y="1696" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#425466">Enables full undo chain</text>

  <rect x="90" y="1582" width="300" height="150" rx="20" fill="#ffffff" stroke="#b7d2cf" stroke-width="2" filter="url(#shadow)"/>
  <text x="124" y="1640" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#16323a">Undo endpoint</text>
  <text x="124" y="1672" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#425466">POST /api/organise/undo</text>
  <text x="124" y="1696" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#425466">Reverse executed actions</text>

  <path d="M750 248 L750 314" stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M750 434 L750 498" stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M750 618 L750 700" stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M750 960 L750 1028" stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M750 1156 L750 1218" stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M750 1346 L750 1458" stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <path d="M520 1588 L420 1588" stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M980 1588 L1110 1588" stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <path d="M240 1582 L240 1406" stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M390 1338 L450 1338 L450 1278" stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <path d="M1260 1406 L1260 1582" stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <text x="776" y="1002" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#4b5563">Yes</text>
  <text x="1006" y="1578" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#4b5563">Execute</text>
  <text x="432" y="1578" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#4b5563">Refine</text>

  
</svg>
