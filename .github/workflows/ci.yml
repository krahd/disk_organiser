name: CI

on:
  push:
  pull_request:

jobs:
  windows-backend:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps (pinned)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path backend/requirements-locked.txt) {
            pip install -r backend/requirements-locked.txt
          } elseif (Test-Path backend/requirements.txt) {
            pip install -r backend/requirements.txt
          }

      - name: Run backend tests (Windows)
        shell: pwsh
        run: |
          pytest -q backend/tests

      - name: Validate OpenAPI route coverage (Windows)
        shell: pwsh
        run: |
          python scripts/validate_openapi.py

  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps (pinned)
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements-locked.txt ]; then
            pip install -r backend/requirements-locked.txt
          elif [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi

      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements-locked.txt

      - name: Run backend tests
        run: |
          cd backend
          pytest -q

      - name: Validate OpenAPI route coverage
        run: |
          python scripts/validate_openapi.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Node dependencies
        run: |
          npm ci

      - name: Node dependency audit
        run: |
          npm audit --audit-level=moderate

      - name: Prettier check
        run: |
          npm run format:check

      - name: Run unit tests (Jest)
        run: |
          npm test --silent

      - name: Install Playwright apt dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-xcb1 libxcomposite1 libxcursor1 libxdamage1 libxrandr2 libxss1 libxtst6 libnss3 libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 libasound2 libgbm1 libatspi2.0-0 libpangocairo-1.0-0

      - name: Install Playwright browsers
        run: |
          npx playwright install --with-deps

      - name: Run visual tests (Playwright)
        run: |
          # visual specs load local frontend/index.html directly (no external server required)
          # skip modal snapshot that lacks baseline in CI
          npx playwright test frontend/visual --grep-invert "preview modal"
