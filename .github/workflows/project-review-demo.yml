name: Synthetic project review UI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  demo-contract:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing pinned dependencies
        run: python -m pip install -r backend/requirements-locked.txt
      - name: Test isolated fixture HTTP contract without sockets
        run: python -m unittest discover -s prototypes/drive_administration/demo_tests -v

  demo-browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing pinned dependencies
        run: python -m pip install -r backend/requirements-locked.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: npm ci
      - name: Test tab-memory draft and stale response handling
        run: npx jest --config jest.config.js --runInBand frontend/__tests__/project-review-demo.test.js
      - name: Install the existing locked Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Test the isolated synthetic server in Chromium
        run: npx playwright test --config playwright.project-review.config.js
      - name: Save synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-review-synthetic-screens
          path: test-results/project-review/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save focused project choices screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-choices-synthetic-screens
          path: test-results/project-review/project-choices-*/*.png
          if-no-files-found: ignore
          retention-days: 14
