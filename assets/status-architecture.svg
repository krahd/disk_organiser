<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1060" viewBox="0 0 1680 1060" role="img" aria-labelledby="title desc">
  <title id="title">Disk Organiser Architecture Diagram</title>
  <desc id="desc">Architecture view of frontend, Flask orchestration, analysis and planning modules, safety and storage modules, plus filesystem and model runtime integrations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5f8f4"/>
      <stop offset="100%" stop-color="#edf3fb"/>
    </linearGradient>
    <linearGradient id="front" x1="0" x2="1">
      <stop offset="0%" stop-color="#1f6f78"/>
      <stop offset="100%" stop-color="#2f8c8f"/>
    </linearGradient>
    <linearGradient id="core" x1="0" x2="1">
      <stop offset="0%" stop-color="#1f3c57"/>
      <stop offset="100%" stop-color="#2f567b"/>
    </linearGradient>
    <linearGradient id="model" x1="0" x2="1">
      <stop offset="0%" stop-color="#a75a0a"/>
      <stop offset="100%" stop-color="#c57c11"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f2734" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect width="1680" height="1060" fill="url(#bg)" rx="24"/>

  <text x="58" y="70" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#1b2630">Disk Organiser Architecture</text>
  <text x="58" y="106" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#425466">Preview-first workflow with safe execution and undo, driven by Modelito and local runtime capabilities.</text>

  <rect x="70" y="154" width="310" height="146" rx="20" fill="url(#front)" filter="url(#shadow)"/>
  <text x="98" y="200" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#ffffff">User + Browser</text>
  <text x="98" y="232" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#e8fffa">frontend/index.html</text>
  <text x="98" y="256" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#e8fffa">frontend/main.js</text>
  <text x="98" y="280" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#e8fffa">Organise, preview, chat, execute</text>

  <rect x="450" y="132" width="760" height="206" rx="24" fill="url(#core)" filter="url(#shadow)"/>
  <text x="484" y="184" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Flask API Orchestration Layer</text>
  <text x="484" y="218" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#dce9f5">backend/app.py</text>
  <text x="484" y="246" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#dce9f5">Routes: analyse/start, analyse/reason, chat, preview, execute, undo</text>
  <text x="484" y="272" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#dce9f5">Preferences + model selection, plus Ollama install/start/stop/pull/serve/delete</text>
  <text x="484" y="298" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#dce9f5">Central error handling, validation entrypoints, and operation metadata assembly</text>

  <rect x="1260" y="154" width="350" height="146" rx="20" fill="url(#model)" filter="url(#shadow)"/>
  <text x="1288" y="200" font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#fff9ef">Model Runtime</text>
  <text x="1288" y="232" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#fff2d9">backend/model_client.py</text>
  <text x="1288" y="256" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#fff2d9">backend/model_wrappers/modelito.py</text>
  <text x="1288" y="280" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#fff2d9">Modelito SDK + Ollama process helpers</text>

  <rect x="120" y="406" width="420" height="208" rx="20" fill="#ffffff" stroke="#b6d2cf" stroke-width="2" filter="url(#shadow)"/>
  <text x="152" y="456" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#16323a">Analysis Pipeline</text>
  <text x="152" y="490" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#3a4a54">backend/tasks.py</text>
  <text x="152" y="514" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#3a4a54">backend/context_builder.py</text>
  <text x="152" y="538" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#3a4a54">Near-duplicate and stale-file signals</text>
  <text x="152" y="562" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#3a4a54">OCR and embedding capability detection</text>
  <text x="152" y="586" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#3a4a54">Background job progress for scan and analysis</text>

  <rect x="640" y="406" width="420" height="208" rx="20" fill="#ffffff" stroke="#b6d2cf" stroke-width="2" filter="url(#shadow)"/>
  <text x="672" y="456" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#16323a">Planning + Validation</text>
  <text x="672" y="490" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#3a4a54">backend/action_planner.py</text>
  <text x="672" y="514" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#3a4a54">backend/validation.py</text>
  <text x="672" y="538" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#3a4a54">Normalize and validate action payloads</text>
  <text x="672" y="562" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#3a4a54">Group actions for preview readability</text>
  <text x="672" y="586" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#3a4a54">Keep all operations inside allowed roots</text>

  <rect x="1160" y="406" width="420" height="208" rx="20" fill="#ffffff" stroke="#b6d2cf" stroke-width="2" filter="url(#shadow)"/>
  <text x="1192" y="456" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#16323a">Safety + Operation Store</text>
  <text x="1192" y="490" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#3a4a54">backend/fs_ops.py</text>
  <text x="1192" y="514" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#3a4a54">backend/op_store.py</text>
  <text x="1192" y="538" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#3a4a54">Preview, backup, execute selected actions</text>
  <text x="1192" y="562" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#3a4a54">Undo in reverse order from stored backups</text>
  <text x="1192" y="586" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#3a4a54">Recycle cleanup and snapshot support</text>

  <rect x="250" y="706" width="520" height="170" rx="20" fill="#fffaf2" stroke="#efc98d" stroke-width="2" filter="url(#shadow)"/>
  <text x="286" y="758" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#5f370e">Local Filesystem</text>
  <text x="286" y="790" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b4b25">User-selected roots and discovered file contexts</text>
  <text x="286" y="814" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b4b25">Targets for reversible moves, stale cleanup, and symlink actions</text>
  <text x="286" y="838" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b4b25">Backed up state enables operation-level undo</text>

  <rect x="910" y="706" width="520" height="170" rx="20" fill="#fffaf2" stroke="#efc98d" stroke-width="2" filter="url(#shadow)"/>
  <text x="946" y="758" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#5f370e">Documentation + Checks</text>
  <text x="946" y="790" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b4b25">docs/openapi.json and scripts/validate_openapi.py</text>
  <text x="946" y="814" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b4b25">STATUS.md and implementation-state synchronization</text>
  <text x="946" y="838" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#6b4b25">Route drift and capability reporting safeguards</text>

  <path d="M380 227 L450 227" stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1210 227 L1260 227" stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M830 338 L830 406" stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1060 510 L1160 510" stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M640 510 L540 510" stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M280 614 L280 676 L380 676 L380 706" stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1420 614 L1420 676 L1320 676 L1320 706" stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1435 300 L1435 406" stroke="#4b5563" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  
</svg>
